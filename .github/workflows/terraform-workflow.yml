name: Terraform CI/CD

on:
  pull_request:
    paths:
      - '**.tf'

  push:
    branches: [main]
    paths:
      - '**.tf'

permissions:
  contents: read
  pull-requests: write

jobs:
  terraform:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: "1.7.0"

    - name: Validate Secret Configuration
      run: |
        echo "=== Checking AWS_ACCESS_KEY ==="
        if [ -z "${{ secrets.AWS_ACCESS_KEY }}" ]; then
          echo "❌ ERROR: 'AWS_ACCESS_KEY' is empty or not found!"
        else
          LEN=$(echo -n "${{ secrets.AWS_ACCESS_KEY }}" | wc -m)
          echo "✅ 'AWS_ACCESS_KEY' exists. Length: $LEN characters (Standard AWS ID is 20)."
        fi

        echo "=== Checking AWS_SECRET_ACCESS_KEY ==="
        if [ -z "${{ secrets.AWS_SECRET_ACCESS_KEY }}" ]; then
          echo "❌ ERROR: 'AWS_SECRET_ACCESS_KEY' is empty or not found!"
        else
          LEN=$(echo -n "${{ secrets.AWS_SECRET_ACCESS_KEY }}" | wc -m)
          echo "✅ 'AWS_SECRET_ACCESS_KEY' exists. Length: $LEN characters (Standard Secret is 40)."
        fi

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1

    - name: Terraform Format checkout
      run: terraform fmt -check -recursive

    - name: Terraform Init
      run: terraform init

    - name: Terraform Validate
      run: terraform validate

    - name: Terraform Plan
      if: github.event_name == 'pull_request'
      id: plan
      run: terraform plan -no-color -out=tfplan
      continue-on-error: true

    - name: Post plan to PR
      if: always() && github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          const output = `#### Terraform plan
          \`\`\`
          ${{ steps.plan.output.stdout }}
          \`\`\`
          `;
          github.rest.issues.createComment({
          issue_number: context.issue.number,
          owner: context.repo.owner,
          repo: context.repo.repo,
          body: output
          });

    - name: Fail if Plan Failed
      if: always() && github.event_name == 'pull_request' && steps.plan.outcome == 'failure'
      run: exit 1

    - name: Terraform Apply
      if: github.ref == 'refs/head/main' && github.event_name == 'push'
      run: terraform apply -auto-approve
